name: Incident ingest

# Entrada de alertas de ferramentas de monitoramento via repository_dispatch.
# Deduplica por fingerprint: alerta repetido vira comentário, não issue nova.
#
# Contrato do client_payload:
#   fingerprint  (obrigatório) — identificador estável do alerta (ex: "api-prod-high-5xx")
#   title        (obrigatório) — título curto do alerta
#   severity     — 1..4 (default 3)
#   service      — serviço afetado
#   summary      — descrição do problema
#   source       — ferramenta de origem (datadog, alertmanager, upptime...)
#   url          — link para o alerta/dashboard
#   status       — "firing" (default) ou "resolved"
#
# Exemplo de disparo:
#   curl -X POST \
#     -H "Authorization: Bearer $GITHUB_TOKEN" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/ORG/REPO/dispatches \
#     -d '{"event_type":"alert","client_payload":{"fingerprint":"api-high-5xx","title":"API 5xx acima de 5%","severity":1,"service":"API","status":"firing"}}'

on:
  repository_dispatch:
    types: [alert]

permissions:
  issues: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Criar ou atualizar o incidente
        id: ingest
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload || {};
            if (!p.fingerprint || !p.title) {
              core.setFailed('client_payload.fingerprint e client_payload.title são obrigatórios.');
              return;
            }

            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const sevNum = [1, 2, 3, 4].includes(Number(p.severity)) ? Number(p.severity) : 3;
            const sev = `sev${sevNum}`;
            const status = (p.status || 'firing').toLowerCase();
            const source = p.source || 'monitoramento';
            const marker = `<!-- fingerprint:${p.fingerprint} -->`;

            // Dedup: procura incidente aberto com o mesmo fingerprint no corpo.
            // listForRepo em vez da Search API para evitar atraso de indexação.
            const { data: open } = await github.rest.issues.listForRepo({
              ...repo, state: 'open', labels: 'incident', per_page: 100,
            });
            const existing = open.find(i => (i.body || '').includes(marker));

            core.setOutput('notify', 'false');
            core.setOutput('page', 'false');

            if (status === 'resolved') {
              if (!existing) return;
              await github.rest.issues.createComment({
                ...repo, issue_number: existing.number,
                body: `✅ Alerta normalizado na origem (${source}). Verifique o serviço antes de rodar \`/resolve\`.`,
              });
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                ...repo, issue_number: existing.number,
                body: `🔁 Alerta disparou novamente (${source}): ${p.title}${p.url ? ` — ${p.url}` : ''}`,
              });
              return;
            }

            // Issues criadas com GITHUB_TOKEN não disparam o incident-triage.yml
            // (prevenção de recursão do Actions), então a label de severidade e a
            // notificação Slack são responsabilidade deste workflow.
            const body = [
              marker,
              `**Origem:** ${source}${p.url ? ` — [ver alerta](${p.url})` : ''}`,
              `**Severidade:** Sev${sevNum}`,
              `**Serviço afetado:** ${p.service || 'não informado'}`,
              `**Início do impacto:** ${new Date().toISOString()}`,
              '',
              '## Impacto observado',
              p.summary || p.title,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              ...repo,
              title: `[INC] ${p.title}`,
              labels: ['incident', 'triage', sev],
              body,
            });

            core.notice(`Incidente criado: #${issue.number}`);
            if (sevNum <= 2) {
              core.setOutput('notify', 'true');
              core.setOutput('message', `🚨 Incidente aberto automaticamente (${source}): ${issue.title} — ${issue.html_url}`);
              core.setOutput('page', 'true');
              core.setOutput('severity', sev);
              core.setOutput('issue_number', String(issue.number));
              core.setOutput('issue_url', issue.html_url);
              core.setOutput('issue_title', issue.title);
            }

      - uses: actions/checkout@v4
        if: steps.ingest.outputs.page == 'true'

      - name: Acionar o on-call (Sev1 e Sev2)
        if: steps.ingest.outputs.page == 'true'
        uses: ./.github/actions/page-oncall
        with:
          action: trigger
          summary: ${{ steps.ingest.outputs.issue_title }}
          severity: ${{ steps.ingest.outputs.severity }}
          dedup-key: ${{ github.repository }}#${{ steps.ingest.outputs.issue_number }}
          url: ${{ steps.ingest.outputs.issue_url }}
          provider: ${{ vars.PAGING_PROVIDER || 'none' }}
          endpoint: ${{ vars.PAGING_ENDPOINT || '' }}
          key: ${{ secrets.PAGING_KEY || '' }}

      - name: Notificar Slack (Sev1 e Sev2)
        if: steps.ingest.outputs.notify == 'true'
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ${{ toJSON(steps.ingest.outputs.message) }}
