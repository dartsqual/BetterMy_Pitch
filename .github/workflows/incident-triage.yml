name: Incident triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'incident')
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar label de severidade a partir do formulário
        id: severity
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('page', 'false');
            const body = context.payload.issue.body || '';
            const match = body.match(/sev\s*([1-4])/i);
            if (!match) {
              core.warning('Severidade não encontrada no corpo da issue.');
              return;
            }
            const sev = `sev${match[1]}`;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sev],
            });
            core.setOutput('severity', sev);
            core.setOutput('page', ['sev1', 'sev2'].includes(sev) ? 'true' : 'false');

      # A inclusão no Project fica por conta do workflow built-in "Auto-add"
      # do próprio projeto (Settings do projeto → Workflows) — não precisa de código.

      - uses: actions/checkout@v4
        if: steps.severity.outputs.page == 'true'

      - name: Acionar o on-call (Sev1 e Sev2)
        if: steps.severity.outputs.page == 'true'
        uses: ./.github/actions/page-oncall
        with:
          action: trigger
          summary: ${{ github.event.issue.title }}
          severity: ${{ steps.severity.outputs.severity }}
          dedup-key: ${{ github.repository }}#${{ github.event.issue.number }}
          url: ${{ github.event.issue.html_url }}
          provider: ${{ vars.PAGING_PROVIDER || 'none' }}
          endpoint: ${{ vars.PAGING_ENDPOINT || '' }}
          key: ${{ secrets.PAGING_KEY || '' }}

      - name: Notificar Slack (Sev1 e Sev2)
        if: steps.severity.outputs.page == 'true'
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 Incidente aberto: ${{ github.event.issue.title }} — ${{ github.event.issue.html_url }}"
